<!DOCTYPE html>
<html>
<head><title>Your Plan - FitBuddy</title></head>
<body style="background:#0f172a; color:white; font-family:sans-serif; padding:20px;">
<h1>{{ name }}'s Fitness Plan</h1>
<p>Goal: {{ goal }} • BMI: {{ bmi }}</p>

<div style="background:#1e293b; padding:15px; border-radius:10px; margin:10px 0;">
<h3>7-Day Workout Plan</h3>
<pre style="white-space:pre-wrap;">{{ plan.workout }}</pre>
</div>

<div style="background:#1e293b; padding:15px; border-radius:10px; margin:10px 0;">
<h3>Nutrition Tip</h3>
<p>{{ plan.nutrition }}</p>
<h3>Recovery Tip</h3>
<p>{{ plan.recovery }}</p>
</div>

<div style="background:#1e293b; padding:15px; border-radius:10px;">
<h3>Refine this plan</h3>
<p>Tell FitBuddy what to change - e.g. "more cardio" or "add a rest day".</p>
</div>

<a href="/" style="color:yellow;">← Go Back</a>
</body>
</html>
