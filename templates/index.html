<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy - AI Fitness</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial; }
        body { background: linear-gradient(135deg, #0f172a, #1e3a8a); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; color:white; }
        .box { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; border: 1px solid rgba(255,255,255,0.2); }
        h1 { text-align:center; margin-bottom:5px; font-size:28px; }
        p { text-align:center; margin-bottom:20px; opacity:0.8; }
        label { display:block; margin: 15px 0 5px; font-weight:bold; }
        input, select { width:100%; padding:12px; border-radius:10px; border:none; font-size:16px; }
        button { width:100%; margin-top:25px; padding:14px; border:none; border-radius:10px; background:#facc15; font-weight:bold; font-size:18px; cursor:pointer; }
        button:hover { background:#eab308; }
    </style>
</head>
<body>
    <div class="box">
        <h1>💪 FitBuddy</h1>
        <p>AI Fitness Plan Generator</p>
        <form action="/generate" method="post">
            <label>Name</label>
            <input type="text" name="name" placeholder="saranya" required>

            <label>Age</label>
            <input type="number" name="age" placeholder="22" required>

            <label>Gender</label>
            <select name="gender" required>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="other">Other</option>
            </select>

            <label>Height (cm)</label>
            <input type="number" step="0.1" name="height" placeholder="165" required>

            <label>Weight (kg)</label>
            <input type="number" step="0.1" name="weight" placeholder="60" required>

            <label>Goal</label>
            <select name="goal" required>
                <option value="weight loss">Weight Loss</option>
                <option value="muscle gain">Muscle Gain</option>
                <option value="fitness">General Fitness</option>
            </select>

            <label>Activity Level</label>
            <select name="activity" required>
                <option value="sedentary">Sedentary</option>
                <option value="light">Light</option>
                <option value="moderate">Moderate</option>
                <option value="active">Active</option>
            </select>

            <button type="submit">🚀 Generate Plan</button>
        </form>
    </div>
</body>
</html>
