<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitBuddy - AI Fitness Plan Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --accent:#ff6a3d; --accent2:#ffb703; }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family:'Roboto', sans-serif; color:#fff;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(rgba(10,10,15,0.78), rgba(10,10,15,0.85)),
      radial-gradient(circle at 20% 20%, #232840, #0a0a0f 60%);
    padding: 24px;
  }
  .card {
    width:100%; max-width:480px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12); border-radius:18px;
    padding:32px; backdrop-filter: blur(6px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 { margin:0 0 4px; font-size:1.7rem; }
  .sub { color:#c9c9d6; margin:0 0 24px; font-size:0.95rem; }
  label { display:block; font-size:0.85rem; margin:16px 0 6px; color:#e6e6f0; }
  input, select {
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06); color:#fff; font-size:0.95rem; outline:none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    margin-top:26px; width:100%; padding:14px; border:none; border-radius:12px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    color:#111; font-weight:700; font-size:1rem; cursor:pointer;
    transition: transform 0.15s ease;
  }
  button:hover { transform: translateY(-2px); }
  .footer-link { display:block; text-align:center; margin-top:18px; color:#aaa; font-size:0.8rem; text-decoration:none; }
  .footer-link:hover { color:#fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>💪 FitBuddy</h1>
    <p class="sub">AI-generated 7-day workout plans, tailored to you.</p>

    <form action="/generate-workout" method="post">
      <label for="username">Name</label>
      <input type="text" id="username" name="username" placeholder="e.g. Saranya" required>

      <label for="user_id">User ID</label>
      <input type="text" id="user_id" name="user_id" placeholder="e.g. user001" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="1" max="119" required>

      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" name="weight" min="1" step="0.1" required>

      <label for="goal">Fitness Goal</label>
      <select id="goal" name="goal" required>
        <option value="weight loss">Weight loss</option>
        <option value="muscle gain">Muscle gain</option>
        <option value="general wellness">General wellness</option>
        <option value="flexibility">Flexibility</option>
      </select>

      <label for="intensity">Workout Intensity</label>
      <select id="intensity" name="intensity" required>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>

    <a class="footer-link" href="/view-all-users">Admin: view all users →</a>
  </div>
</body>
</html>
